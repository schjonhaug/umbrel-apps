version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canary_wallet_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/*"

  backend:
    image: schjonhaug/canary-wallet-backend:v1.6.4@sha256:b2a0e5561f481afa36aefc68373d39a589ff9fca906c2c3ef4cb5f89ce4b3399
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      CANARY_WALLET_NETWORK: mainnet
      CANARY_WALLET_ELECTRUM_URL: tcp://$APP_ELECTRS_NODE_IP:$APP_ELECTRS_NODE_PORT
      CANARY_WALLET_BIND_ADDRESS: 0.0.0.0:3001
      CANARY_WALLET_DATA_DIR: /app/data
      CANARY_WALLET_MODE: "self-hosted"
      CANARY_WALLET_SYNC_INTERVAL: 60
      FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      CANARY_WALLET_MEMPOOL_PORT: ${APP_CANARY_WALLET_MEMPOOL_PORT:-}
      CANARY_WALLET_TX_EXPLORER_PLATFORM: umbrel
      CANARY_WALLET_UMBREL_NTFY_URL: ${APP_CANARY_WALLET_UMBREL_NTFY_URL:-}
      CANARY_WALLET_SELF_HOSTED_ADMIN_PASSWORD: ${APP_PASSWORD}
      JWT_SECRET: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

  web:
    image: schjonhaug/canary-wallet-frontend:v1.6.4@sha256:7dc1dc2bcf7cc973f683d0ab13b9292b275e8f52363e9e90225bd856d33a042c
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      API_URL: http://canary_wallet_backend_1:3001
    depends_on:
      - backend
